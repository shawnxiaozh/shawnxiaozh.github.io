# About 页的内容，被 _layouts/about.html 读取。改内容只改这里，不用碰 HTML。
#
# profile 里可选再加：headline（职位）、location（城市）、summary（简介），
# 不写就不显示。

profile:
  name: Shawn Xiao
  avatar: https://github.com/shawnxiaozh.png

# icon 可选值：linkedin / github / email / instagram / rss / link
# url 留空的条目不显示。
# 座右铭，显示在个人卡片下方。text 留空的条目不显示。
mottos:
  - text: 到最后，人会后悔的只有一件事，那就是活得不够勇敢。
  - text: You only live once, but not only one day.

links:
  - label: LinkedIn
    icon: linkedin
    url: ""
  - label: GitHub
    icon: github
    url: https://github.com/shawnxiaozh
  - label: RSS
    icon: rss
    url: /feed.xml
