# About 页的内容，被 _layouts/about.html 读取。改内容只改这里，不用碰 HTML。
#
# profile 里可选再加：headline（职位）、location（城市）、summary（简介），
# 不写就不显示。

profile:
  name: Shawn Xiao
  avatar: https://github.com/shawnxiaozh.png

# icon 可选值：linkedin / github / email / instagram / rss / link
# url 留空的条目不显示。
links:
  - label: LinkedIn
    icon: linkedin
    url: ""
  - label: GitHub
    icon: github
    url: https://github.com/shawnxiaozh
  - label: RSS
    icon: rss
    url: /feed.xml
