# 生词本 · writing
# 字段见 _data/vocab_meta.yml 顶部注释。新词加在最上面（按 added 倒序）。

- term: move past
  pos: v.
  kind: phrase
  meaning: 越过、不再纠结。注意它不表示问题被解决了。
  examples:
  - This helped move past the debate on what is a true agent.
  note: |-
    get past 可互换；get over 更偏情感（走出失恋、康复）。
    和 move on 的区别：move on 是翻篇、去做下一件事；move past 强调越过一个障碍，把它甩在身后，但它不一定被解决了。
  source: English Teacher · 理解文本中的难点
  added: "2026-09-10"
- term: acknowledge
  pos: v.
  kind: word
  meaning: 承认（某个事实成立）。
  examples:
  - We're going to have to acknowledge that systems can be agentic to different degrees.
  note: 和 admit 的区别：admit 常带「不情愿地认下（错误、不利的事）」的意味；acknowledge 只是中性地承认某个事实成立，不代表认输。
  source: English Teacher · 理解文本中的难点
  added: "2026-09-10"
- term: denote
  pos: v.
  kind: word
  meaning: 表示、标志。
  examples:
  - …the red color to denote the user input.
  note: 和 mean / show 的区别：denote 专指符号、颜色、记号按约定代表某个东西（red denotes user input），比 mean 精确，比 show 更像在讲图例。
  source: English Teacher · 理解文本中的难点
  added: "2026-09-10"
- term: binary
  pos: n. / adj.
  kind: word
  meaning: 非此即彼的二元判断。
  examples:
  - …as an adjective rather than a binary.
  note: 和 either-or / yes-or-no 的区别：binary 借自计算机的 0 / 1，听起来像术语；拿来当名词说 a binary，常带着批评「把连续的东西硬分成两类」的意味。
  source: English Teacher · Agentic as a spectrum
  added: "2026-09-10"
- term: carry out
  pos: v.
  kind: phrase
  meaning: 从头到尾把一件事办完（执行、实施）。
  examples:
  - …to carry out an action.
  - One task that many businesses carry out is invoice processing.
  - Tasks like these with a clear process tend to be easier for agentic workflows to carry out.
  note: |-
    "Conduct" 也是这个意思：Claude conducts multiple searches.
    核心语感：照着既定的任务 / 计划去落实，一直做到完。carry（搬）+ out（到底）。
    常搭配 task / plan / research / procedure / instructions，比 do 正式，比 execute 口语。
    可拆开：carry the task out；宾语是代词时必须拆：carry it out（❌ carry out it）。
  source: English Teacher · 理解文本中的难点
  added: "2026-09-10"
- term: dive deeper into
  kind: phrase
  meaning: 深入探讨。
  examples:
  - We'll dive deeper into this later in the course.
  note: |-
    同组：to different degrees、in advance、somewhere in between。
    和 look into / discuss in detail 的区别：dive 的画面是一头扎进水里往深处潜，讲课、演讲时用来预告「后面会深入讲」，比 discuss in detail 生动、随意。
  source: English Teacher · 理解文本中的难点
  added: "2026-09-10"
- term: alongside
  pos: prep.
  kind: word
  meaning: 与……并排、同时进行
  examples:
  - Claude creates in a dedicated window alongside your conversation.
  - Components run alongside yours.
  note: |-
    空间上是"并排"，抽象用法是"同时进行且互不干扰"：She studies alongside a full-time job.
    并排、平级共存。原义是船并排靠岸。 排除了两种想象：不是隔离沙箱，也不是替换你的配置。
    和 next to / along with 的区别：next to 只讲位置挨着；along with 有主次；alongside 强调两者平级、同时存在或进行。
  source: Notion · Work + English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: along with
  pos: prep.
  kind: phrase
  meaning: 连同、随附
  examples:
  - I sent an email along with the spreadsheet.
  - …along with a plain warning that Anthropic doesn't control third-party plugins.
  note: |-
    注意主谓一致：along with 引导的部分不影响谓语单复数。The report, along with the logs, is attached.
    连同、一并。有主次之分 —— 后面那项是附带的。 语法点：不改变主语单复数。The plugin, along with its hooks, is installed.
  source: Notion · Work + English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: over the course of
  kind: phrase
  meaning: 在……的整个过程中。比 during 更强调时间的铺展。
  examples:
  - Claude Code fires around 30 hook events over the course of a session.
  note: course 本义是「流动的路径」——同 the course of a river、golf course 同源。
  source: English Teacher · Understanding Claude Code hook events
  added: "2026-09-08"
- term: line up with
  pos: v.
  kind: phrase
  meaning: 与……吻合、对得上。画面是两组东西并排一一对应。
  examples:
  - They line up with points in the agentic loop where you'd want to step in.
  note: 比 align with 口语，比 correspond to 自然。单独用 line up 是「排队」。
  source: English Teacher · Understanding Claude Code hook events
  added: "2026-09-08"
- term: leave it to trust
  kind: phrase
  meaning: 寄希望于对方自觉。作者的态度：这不叫保障，这叫赌运气。
  examples:
  - Don't leave that to trust.
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: plain
  pos: adj.
  kind: word
  meaning: 直白、不加修饰的（不是「普通」）。
  examples:
  - …a plain warning that Anthropic doesn't control what's inside.
  note: 和 clear / simple 的区别：clear 是讲得清楚，措辞可能很讲究；plain 是不加包装、直说，连委婉都省了，所以 a plain warning 是「直截了当的警告」。
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: a slice of
  kind: phrase
  meaning: 一部分（不是整个）—— 切出来的一片，很形象。
  examples:
  - …and a slice of settings.json.
  note: 和 part of / some of 的区别：slice 暗示是从整体里切出来、完整的一块，比 part of 有画面感，常用来说「只截取了其中一段」。
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: step in
  pos: v.
  kind: phrase
  meaning: 插手、介入（在某个节点上手干预）。
  examples:
  - …points in the agentic loop where you'd want to step in.
  note: 和 intervene 的区别：意思相同，intervene 正式；step in 口语，画面是在某个节点走进去插手，常用于「需要时人来接管一下」。
  source: English Teacher · Understanding Claude Code hook events
  added: "2026-09-08"
- term: reach for
  pos: v.
  kind: phrase
  meaning: （需要时）会去用、伸手拿。文档里常用来说「你会反复用到的那几个」。
  examples:
  - There's a small handful you'll reach for again and again.
  note: |-
    a small handful = 一小撮、寥寥几个。
    和 use 的区别：reach for 的画面是「需要时伸手就去拿」，暗示它是你顺手的首选工具，不只是用过而已。
  source: English Teacher · Understanding Claude Code hook events
  added: "2026-09-08"
- term: otherwise
  pos: adv.
  kind: word
  meaning: 要不然的话 —— 指向一个反事实的对照场景。
  examples:
  - …everything you'd otherwise share by hand.
  note: 这里是说「如果不用 plugin 的话，你只能手工一件件传」。
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: by hand
  kind: phrase
  meaning: 手工、人肉（和自动化、打包安装相对）。
  examples:
  - …everything you'd otherwise share by hand.
  note: 和 manually 的区别：意思一样，manually 书面、偏技术；by hand 口语，更有「一件件亲手去弄、很费事」的画面。
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: the rule stands
  kind: phrase
  meaning: 这条规矩依然成立、结论不变。
  examples:
  - 'Reviewed isn''t the same as trusted. So the rule stands: install only from sources you trust.'
  note: 和 the rule still applies 的区别：stand 的画面是「立着没倒」，暗示经过一番讨论或质疑之后，这条规矩依然成立，比 still applies 更有收尾、下结论的力度。
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: bundle
  pos: v.
  kind: word
  meaning: 把一堆东西打包进一个整体。
  examples:
  - 'It bundles everything: skills, subagents, hooks, and MCP server configs.'
  note: |-
    One version, one install. = 一个版本号，一次安装。
    和 include / package 的区别：include 只是「包含」；package 偏正式的打包、封装；bundle 强调把不同种类的东西捆在一起，作为一个整体交付。
  source: English Teacher · Code Review meaning explained
  added: "2026-09-08"
- term: versus
  pos: prep.
  kind: word
  meaning: （口语用法）而不是、相比之下
  examples:
  - One engineer, one prompt, one task — versus in end zone, it actually has campaigns.
  - It is all real dollars flowing versus speculative utilization.
  note: |-
    书面的 A vs B 是并列对照；但口语里 versus 常当连词用，等于 as opposed to，后面可以直接跟一整个从句（versus in end zone, it has…），语法上不严谨但会上很常见。中文使用者一般只会写 vs 不会说，值得刻意练。缩写 vs.（法律文书用 v.）。
    而不是（= as opposed to），不是「A 对决 B」。 类似："It's a distribution problem versus a product problem."
  source: Notion · Work + English Teacher · Data center infrastructure
  added: "2026-09-06"
- term: specify
  pos: v.
  kind: word
  meaning: 明确规定、指定
  examples:
  - This is where we specify the protocol.
  - Each policy specifies a set of trigger conditions.
  note: |-
    比 say / define 更正式，强调"写清楚、可执行"。名词 spec 就是从这来的。
    明确写明、逐项给出具体取值。比 define 更强调「写死在文档里」。 define 是下定义划边界，describe 只是描述，specify 是写明具体值。
  source: Notion · Work + English Teacher · KYC platform rules
  added: "2026-09-03"
- term: (customer) journey
  pos: n.
  kind: word
  meaning: 客户旅程 —— 用户从头走到尾的那一整条路径。
  examples:
  - …and the corresponding KYC journey.
  note: process 是机构视角，flow 偏技术页面流转，journey 是客户端到端体验。
  source: English Teacher · KYC platform rules
  added: "2026-09-03"
- term: kick in
  pos: v.
  kind: phrase
  meaning: 开始生效、触发。
  examples:
  - At what transaction volume does a restriction kick in?
  note: 和 take effect / start 的区别：take effect 正式；kick in 口语，画面是「到了某个时间点或阈值，自动启动」，常说药效、限制、自动机制。
  source: English Teacher · KYC platform rules
  added: "2026-09-03"
- term: fall back to
  pos: v.
  kind: phrase
  meaning: 回退到（备用方案）。
  examples:
  - If electronic verification fails, the case falls back to document verification.
  note: 和 switch to 的区别：switch to 只是换过去；fall back 的画面是退回后方的阵地，暗示主方案失败了才用，是退而求其次的备用方案。名词 fallback。
  source: English Teacher · KYC platform rules
  added: "2026-09-03"
- term: essentially
  pos: adv.
  kind: word
  meaning: 本质上、说白了
  examples:
  - Essentially, it's the same code path with a different config.
  - It's essentially a static analyzer — it parses the SQL and flags queries that would miss an index.
  note: |-
    用来把复杂的东西一句话概括。近义 basically（更口语）、in essence（更正式）。
    本质上、说白了。剥掉表面细节直指核心。 比 basically 沉稳；fundamentally 更重；in essence 更书面。
  source: Notion · Work + English Teacher · On top of it 是什么意思
  added: "2026-08-06"
- term: verify A against B
  kind: phrase
  meaning: 拿 B 作基准去核验 A。against 后面跟的永远是标准。
  examples:
  - verify the user's data against the government database
  note: 顺序不能反。同类动词：check / validate / match / reconcile / cross-reference。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: in a timely manner
  kind: phrase
  meaning: 及时地。in a … manner 是把形容词转成副词的书面结构。
  examples:
  - We'll respond in a timely manner.
  note: 写作指南建议能用副词就用副词（respond promptly），但合约和规范里偏爱这个结构。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: manner
  pos: n.
  kind: word
  meaning: 方式（≈ way，偏正式书面）。加 s 变 manners 就是「礼貌」，意思完全不同。
  examples:
  - The platform provides a standardised manner for upstream services to request verification.
  note: bad manners 是「没礼貌」，不是「坏方法」。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: request verification
  kind: pattern
  meaning: 请求验证。request 作动词本身已经带有"向……提出要求"的意思，及物动词后面直接接宾语，不需要 for 再引出一次对象——加了 for 等于把动作重复表达了一遍。
  examples:
  - ✅ to request verification　❌ to request for verification
  note: 同类错误：discuss about、emphasise on、contact with——都是中文"请求/讨论/强调/联系 + 介词"的直译习惯，套到及物动词上多了一层不必要的介词。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: dissimulate
  kind: word
  meaning: 掩饰真实情感或意图
  examples:
  - When people dissimulate, they hide their true feelings, intentions, or nature.
  note: 书面语，日常几乎不用，读小说会遇到。口语说 hide it / put on a front。近义 dissemble；反义 be upfront。
  source: Notion · Daily
  added: "2026-07-29"
- term: subsequent
  kind: word
  meaning: 随后的
  examples:
  - For several subsequent days I saw little of Mr Rochester.
  note: 书面语，指"接下来的、后续的"。口语说 the following days / the next few days。副词 subsequently 意为"后来"。
  source: Notion · Daily
  added: "2026-07-29"
- term: not least
  kind: phrase
  meaning: 尤其是、特别是
  examples:
  - It's an expensive city, not least because of the rent.
  note: 等于 especially，语气正式，常用来引出最重要的那个理由。别和 last but not least（最后但同样重要）混淆。
  source: Notion · Daily
  added: "2026-07-29"
- term: span / synthesize
  kind: word
  meaning: 涉及、横跨；synthesize — 整合、综合
  examples:
  - Enterprise Search is particularly valuable for questions that span multiple sources or require synthesizing information from across your organization.
  note: span 强调"跨越多个范围"，synthesize 强调"把零散信息合成一个结论"，比 summarize 更主动。
  source: Notion · Work
  added: "2026-07-29"
- term: reference materials
  kind: phrase
  meaning: 参考资料
  examples:
  - They hold the reference materials Claude needs to understand your work — project specs, meeting notes, research documents.
  note: 指"供查阅"的背景材料，不是要通读的内容。近义 supporting documents / background material。
  source: Notion · Work
  added: "2026-07-29"
- term: research prospects
  kind: phrase
  meaning: 研究方向、可探索的机会
  examples:
  - We mapped out the research prospects for next quarter.
  note: prospect 是"有前景的可能性"。注意别和 perspective（视角）混淆，这两个词很多人会说错。
  source: Notion · Work
  added: "2026-07-29"
- term: have sth in place
  kind: phrase
  meaning: 提前准备好、已就位
  examples:
  - Understand what you need to have in place before you start.
  - Understand what you need to have in place before you begin.
  note: |-
    指流程、权限、监控这类"事先要搭好的东西"。已完成说 it's in place；要落实说 put it in place。
    就位、事先准备好。来源是「东西都在它该在的位置上」。 Have a clear goal in place · Have your sources in place。
    和 prepare / be ready 的区别：prepare 是准备的动作；in place 强调东西已经搭好、放在该在的位置、处于能用的状态，常说流程、权限、监控这类机制。
  source: Notion · Work + English Teacher · Understanding "instead"
  added: "2026-07-29"
- term: in ways that…
  kind: pattern
  meaning: 以……的方式
  examples:
  - It is the ability to collaborate with AI in ways that are effective, efficient, ethical, and safe.
  note: 后面接从句，用来一次挂多个形容词，比 effectively, efficiently… 一串副词更好读。
  source: Notion · Work
  added: "2026-07-29"
- term: inherently
  kind: word
  meaning: 本质上、本身就
  examples:
  - None of these approaches are inherently better than others.
  note: 用来说"好坏取决于场景，不是这个方案天生更好"。近义 by nature / intrinsically。
  source: Notion · Work
  added: "2026-07-29"
- term: how likely are you to…?
  kind: pattern
  meaning: 你有多大可能会……？——用程度提问代替 Would you recommend…? 这种是非问，是为了拿到一个可打分、可统计的梯度答案，而不是简单的会/不会。
  examples:
  - How likely are you to recommend this course to a friend or colleague?
  note: 满意度调查（NPS）的标准问法。回答用 I'm likely to / unlikely to + 动词原形。
  source: Notion · Work
  added: "2026-07-29"
- term: as per
  kind: phrase
  meaning: 根据、按照（正式）
  examples:
  - His contract, as per the offer, runs till Dec 2026.
  note: 合同、邮件里的正式用词。口语和普通邮件用 according to 或直接说 based on 更自然，as per 用多了显得刻板。
  source: Notion · Work
  added: "2026-07-29"
- term: with ease
  kind: phrase
  meaning: 轻松地、毫不费力地
  examples:
  - I'm now communicating with external data sources with ease.
  note: 比 easily 更书面、更强调"完全不费劲"。口语里 easily 就够了。
  source: Notion · Work
  added: "2026-07-29"
- term: take place
  kind: phrase
  meaning: 发生、进行
  examples:
  - This is how the communication between the client and the server takes place.
  note: 用于有安排、有过程的事（会议、流程、通信）。突发事件用 happen / occur，不用 take place。
  source: Notion · Work
  added: "2026-07-29"
- term: correspond to
  kind: phrase
  meaning: 对应于
  examples:
  - The shared logs correspond to this second call.
  note: 强调一一对应关系。注意区分 correspond with sb（与某人通信）。
  source: Notion · Work
  added: "2026-07-29"
- term: whereby
  kind: word
  meaning: 借此、由此（= by which）
  examples:
  - It has this concept of campaigns, whereby it will persist all the context.
  note: 正式的关系副词，引出"通过这个机制会怎样"：a process whereby every change is reviewed。书面语，口语和普通邮件说 where / in which / and that way 更自然。注意它不能单独起句，必须挂在前面的名词上。
  source: Notion · Work
  added: "2026-07-29"
- term: occur
  kind: word
  meaning: 发生（正式）
  examples:
  - Is this just occurring in the last four hours, or has it been occurring for a while?
  note: 事故沟通里比 happen 正式。注意时态对比：现在进行时问"正在发生"，现在完成进行时问"持续了多久"。
  source: Notion · Work
  added: "2026-07-29"
- term: mount a challenge
  kind: phrase
  meaning: 发起挑战
  examples:
  - Mounting an effective challenge to Google will still be tough.
  note: mount 在这里是"组织并发起"，常搭配 mount a campaign / defence / challenge。比 make a challenge 正式且有力。
  source: Notion · Work
  added: "2026-07-29"
