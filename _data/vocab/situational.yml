# 生词本 · situational
# 绑定特定场合才说的说法和话术，换个场合就不说了。
# 字段见 _data/vocab_meta.yml 顶部注释。新词加在最上面（按 added 倒序）。

- term: the payment is issued
  pos: v.
  kind: phrase
  meaning: 这笔款按流程正式开出去了（签发付款）。
  examples:
  - record these in a database to make sure that payment is issued in time
  - if return is allowed, then have the agent issue a return packing slip
  - We hit a BQ quota issue, right?
  note: |-
    issue /ˈɪʃuː/ 本义是"往外流出"（ex- 出 + ire 走），河流的出口就叫 issue。东西从机构里流出来 = 签发；事情冒出来堵在面前 = 名词的"问题"。动词名词是同一个画面的两头。
    vs make / send a payment：make a payment 只是把钱付了，谁都能说；payment is issued 强调是付款方走完流程正式开出这笔款，有审批、有记录。财务、行政语境常用被动，重点在款发出去了，不在谁点的按钮。
    同样搭配：issue an invoice / a refund / a receipt / a packing slip / a passport / a visa / a ticket / a statement / a warning；发出方一般是公司、银行、政府这类机构。
    ❌ issue sb a problem（名词义不能这么用）。
  source: Claude Code · agentic AI 视频
  added: "2026-09-16"
- term: enter a prompt
  kind: phrase
  meaning: 输入一条提示词（在对话框里打字发给 AI）。
  examples:
  - Whenever you enter a prompt, Claude reads a file, runs a tool call, gets a tool call result. This is adding on to the context window.
  - Enter a prompt and press Enter to send it.
  note: |-
    enter 在界面语境里是「输入、键入」，不是「进入」。
    同类搭配：enter your password / enter a command / enter text。
    prompt 在这里是名词「提示词、你发给模型的那段话」。
    ❌ 理解成「进入一个提示」。
    和 type / input 的区别：type 强调打字这个动作；input 偏技术；enter 是界面上的标准说法，指「输入并提交」。
  source: Claude Code · context window 原理
  added: "2026-09-13"
- term: be well within your rights to …
  kind: phrase
  meaning: 你完全有权（做某事），不必觉得亏心。
  examples:
  - You're well within your rights to sell 10% of your shares.
  note: 和 you can 的区别：you can 只说可以做；be well within your rights 多了一层「这是正当的，别人没理由指责你」，常用来打消对方的心理负担。
  source: English Teacher · Data center infrastructure
  added: "2026-09-06"
- term: circle back
  pos: v.
  kind: phrase
  meaning: 回头再聊这件事。
  examples:
  - Let's circle back on this next week.
  note: 和 talk about it later 的区别：circle back 的画面是绕一圈再回到这个点，暗示现在先放一放，但之后一定会回来处理，不是不了了之。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: loop in
  pos: v.
  kind: phrase
  meaning: 把某人拉进讨论、抄送进来。
  examples:
  - I'll loop in the platform team.
  note: 和 cc / include 的区别：cc 只是把人加进邮件抄送；loop in 是让对方进入讨论圈，之后持续知情、参与。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: bump the PR
  kind: phrase
  meaning: 顶一下 PR，提醒别人来审。
  examples:
  - Can you bump the PR? It's been sitting for two days.
  note: 和 remind sb 的区别：remind 是点名提醒某个人；bump 是把帖子或 PR 顶上去，更轻，不像在点名催。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: take it offline
  kind: phrase
  meaning: 这个会后单聊，别占用会议时间。
  examples:
  - Good question — let's take it offline.
  note: 和 let's discuss later 的区别：不是字面上的「离线」，而是移出当前会议、会后单独聊。它明确在说「这个不适合占用大家的时间」，比 later 更有控场感。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: park that
  pos: v.
  kind: phrase
  meaning: 先搁置，之后再说。
  examples:
  - Let's park that for now.
  note: 和 put it aside / postpone 的区别：画面是把车先停在路边，暗示这个话题没丢，之后还会开走；会上用来礼貌地打断跑题。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: take sth to standup
  pos: n.
  kind: phrase
  meaning: 每天早上站着开的十几分钟同步会（站会）。
  examples:
  - Let's take that to standup tomorrow.
  note: |-
    难点是它不带冠词、像地点一样用：take it to standup、in standup、after standup；❌ in the standup 听着别扭。
    全称 daily standup / daily scrum，站着开就是为了逼大家说短。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: my only blocker is sth
  pos: n.
  kind: phrase
  meaning: 挡在路上、不解决就没法往下做的那一件事（阻塞点）。
  examples:
  - My only blocker is waiting on the API key.
  note: |-
    vs issue / problem：issue 是一般的问题，可以带着走；blocker 特指挡路的那一个。站会上说 blocker，就是在求助。
    另一个意思别混：日历上的 blocker / blocked invite 是先占住一段时间的会议邀请（send out a blocker for that），和"阻塞点"无关，靠语境分。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: have the bandwidth for sth
  pos: n.
  kind: phrase
  meaning: 精力和处理能力上还剩的那点余量（带宽）。
  examples:
  - I don't have the bandwidth for that this sprint.
  note: |-
    vs time：time 只说时间；bandwidth 借自网络带宽，说的是脑力和处理量的余量。拒绝时说 I don't have the bandwidth，听起来是容量满了、不是不想做，比 I'm busy 得体。
    固定搭配：the bandwidth for sth / to do sth。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: EOD / ETA
  kind: phrase
  meaning: 今天下班前 / 预计完成时间。
  examples:
  - I'll have it done by EOD. What's the ETA on the fix?
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: ship it / LGTM
  kind: phrase
  meaning: 发吧 / Looks Good To Me，代码审查通过。
  examples:
  - LGTM, ship it.
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: this is a nitpick, but …
  kind: pattern
  meaning: 挑的是无关紧要的小毛病（挑刺）；bikeshedding 则是一群人在小事上争个没完。
  examples:
  - This is a nitpick, but… · We're bikeshedding on the button color.
  note: |-
    代码审查里先说 This is a nitpick, but…，等于先声明"这是小事、不阻塞合并"，免得对方觉得被挑刺 —— 是缓冲语，不是谦虚。
    bikeshedding 来自"大家对核电站设计插不上嘴，却为自行车棚刷什么颜色吵个没完"。
    常见：a nitpick / nitpicky、we're bikeshedding on sth。
  source: English Teacher · 改进英语听力的方法
  added: "2026-09-06"
- term: Which team would I be joining?
  kind: phrase
  meaning: 我会加入哪个组？比 which team I am in 通顺。
  examples:
  - Which team would I be joining? And how long is the project expected to run?
  note: 用 would 把话说成假设，不预设 offer 已经到手，比 Which team will I join? 更礼貌、不显得想当然。be joining 是把入职当成已经安排好的事来问，比 join 自然。
  source: English Teacher · Asking about project role and duration
  added: "2026-09-03"
- term: your TA — talent acquisition
  kind: phrase
  meaning: TA = talent acquisition，公司的招聘部门／招聘专员，求职时对接你的那个人。
  examples:
  - Your TA will reach out to schedule the interview.
  note: |-
    vs recruiter：recruiter 更通用，猎头和公司内部的都能这么叫；TA 是公司内部招聘部门的叫法，所以对方自称 TA，说明是公司自己的人，不是猎头。
    常见：your TA will reach out、I'll loop in our TA。
  source: English Teacher · Understanding TA abbreviation
  added: "2026-08-14"
- term: my TA — teaching assistant
  kind: phrase
  meaning: TA = teaching assistant，助教。校园语境里的 TA。
  examples:
  - She's my TA for this course.
  note: |-
    同一个缩写靠场合分：校园里是助教，求职邮件里几乎一定是 talent acquisition。
    常见：my TA、the TA for this course、office hours with the TA。
  source: English Teacher · Understanding TA abbreviation
  added: "2026-08-14"
- term: I had my first-round interview
  kind: phrase
  meaning: 我参加了第一轮面试。比 I finished the interview 自然得多。
  examples:
  - I had my first-round interview yesterday. Could you let me know the next steps?
  note: |-
    写邮件时 had > completed > finished。
    finished 暗示「熬完 / 做完一项任务」，completed 像在交差；had 只是陈述参加了这场面试，最自然。
  source: English Teacher · Asking about next interview steps
  added: "2026-08-13"
- term: board the plane
  pos: v.
  kind: phrase
  meaning: 登机。机场广播和正式场合都用这个。
  examples:
  - We'll start boarding in 20 minutes.
  note: 口语说 get on the plane。大交通工具用 get on，轿车出租车才用 get in。
  source: English Teacher · 飞机登机的英文表达
  added: "2026-08-06"
- term: in a timely manner
  kind: phrase
  meaning: 及时地。in a … manner 是把形容词转成副词的书面结构。
  examples:
  - We'll respond in a timely manner.
  note: 写作指南建议能用副词就用副词（respond promptly），但合约和规范里偏爱这个结构。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: in a standardised manner
  pos: n.
  kind: phrase
  meaning: 方式（≈ way，偏正式书面）。加 s 变 manners 就是「礼貌」，意思完全不同。
  examples:
  - The platform provides a standardised manner for upstream services to request verification.
  note: bad manners 是「没礼貌」，不是「坏方法」。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: request verification
  kind: pattern
  meaning: 请求验证。request 作动词本身已经带有"向……提出要求"的意思，及物动词后面直接接宾语，不需要 for 再引出一次对象——加了 for 等于把动作重复表达了一遍。
  examples:
  - ✅ to request verification　❌ to request for verification
  note: 同类错误：discuss about、emphasise on、contact with——都是中文"请求/讨论/强调/联系 + 介词"的直译习惯，套到及物动词上多了一层不必要的介词。
  source: English Teacher · Upstream service verification
  added: "2026-08-06"
- term: boarding pass / gate / final call
  kind: phrase
  meaning: 登机牌／登机口／最后登机广播。
  examples:
  - Final call for passengers on flight SQ806.
  note: 下飞机：get off the plane，正式说 deplane。
  source: English Teacher · 飞机登机的英文表达
  added: "2026-08-06"
- term: blow up the call stack
  kind: phrase
  meaning: 递归太深导致爆栈。
  examples:
  - This could blow up the call stack.
  note: |-
    DFS uses a stack — either explicit or the call stack via recursion.
    和 cause a stack overflow 的区别：stack overflow 是正式的错误名；blow up 是口语，画面是把栈撑爆，面试里讲风险时更自然。
  source: English Teacher · DFS英文含义
  added: "2026-08-04"
- term: a prep call
  pos: n.
  kind: phrase
  meaning: 正式的事之前先通个气、一起对一遍（准备沟通）。prep = preparation。
  examples:
  - Can you speak today for a prep?
  note: |-
    这里的 speak 是英式的「通个电话」，不是「演讲」。
    和 preparation / briefing 的区别：prep 是口语里的缩略，recruiter 的电话、消息里常见；preparation 太书面；briefing 更像单方面交代情况，prep 是一起准备。
  source: English Teacher · 面试前准备通话的含义和回复
  added: "2026-08-04"
- term: bar raiser
  kind: phrase
  meaning: 专门来「把杆抬高一格」的那个把关面试官（亚马逊面试体系里的抬杆人）。
  examples:
  - And finally got one final round called "bar raiser".
  note: |-
    raise the bar 是跳高比赛把横杆往上挪 —— 提高标准。bar raiser 就是那个负责挪杆的人。
    vs final-round interviewer：位置上是最后一轮没错，但重点不在轮次，而在这人来自别的部门、不归招人的老板管，职责就是拦下「达标但没高过现有员工平均线」的候选人。所以说 bar raiser，不说 final interviewer。
  source: English Teacher · 英语听力差如何通过技术面试
  added: "2026-07-31"
- term: sb is terminated
  kind: phrase
  meaning: 到这儿划一刀，关系就此结束（终止合同、解雇）。term 是「界限、期限」，terminate = 给它画上终点。
  examples:
  - He was terminated last week.
  note: |-
    vs fired：fired 是「因为你干得不行/犯了事」把人赶走，带情绪；terminate 不说原因，只陈述雇佣关系被正式结束，是 HR 和合同文本的冷冰冰用语。所以公告、信件里用 terminate，聊天里说 fired。
    同一件事的其他说法：let go（最委婉）、made redundant（英式，岗位取消）、laid off（公司层面裁员）。
    也用于非人事：terminate a contract / a session / a process。
  source: Notion · Work
  added: "2026-07-29"
- term: refreshments will be provided
  kind: phrase
  meaning: 活动上摆的饮料点心，不是正餐（茶点）。
  examples:
  - Free refreshments will be provided.
  note: |-
    这个意思只有复数形式，而且是场合固定用词——邀请函、会议通知上写 refreshments will be provided；朋友之间说 snacks and drinks。
    单数 refreshment 是抽象的"提神、休息"，不指食物。
  source: Notion · Daily
  added: "2026-07-29"
- term: push live
  kind: phrase
  meaning: 推上线，把改动发布到生产环境
  examples:
  - We're pushing the new checkout flow live on Thursday.
  note: 比 deploy 口语；deploy 偏技术动作，push live 强调"用户能看到了"。也说 go live（不及物）：We go live on Monday.
  source: Notion · Work
  added: "2026-07-29"
- term: experience a drop in traffic
  kind: phrase
  meaning: 流量下跌
  examples:
  - We experienced a drop in traffic right after the release.
  note: experience + 负面事件是事故沟通的固定说法（experience an outage / degradation），比 we had 更中性、不认责。
  source: Notion · Work
  added: "2026-07-29"
- term: ramp up
  kind: phrase
  meaning: 逐步放量、逐步提升
  examples:
  - We ramped it up to 20% traffic yesterday.
  note: 灰度发布的标准词，强调"分阶段慢慢加"。回退是 ramp down / roll back。名词 ramp：the 20% ramp。
  source: Notion · Work
  added: "2026-07-29"
- term: the metrics are not emitted
  kind: phrase
  meaning: 指标没有上报出来
  examples:
  - The metrics aren't emitted for that code path.
  note: emit 指程序主动把指标/事件发出去。没采集到用 not collected，没显示用 not showing up in the dashboard。
  source: Notion · Work
  added: "2026-07-29"
- term: roll out
  kind: phrase
  meaning: 发布、铺开
  examples:
  - Maybe it was rolled out consecutively with that new rule.
  note: |-
    强调"分批推给用户"的过程。撤回是 roll back。名词连写：a phased rollout。
    和 release / launch 的区别：release 是发布这个动作；launch 强调隆重上线；roll out 强调逐步铺开到所有用户的过程。
  source: Notion · Work
  added: "2026-07-29"
- term: drop a field
  kind: phrase
  meaning: 不传 / 去掉某个字段
  examples:
  - They're dropping the field entirely on that flow.
  note: drop 在数据语境里是"丢弃、不发送"。数据库里 drop 是删表删列，语气更硬。
  source: Notion · Work
  added: "2026-07-29"
- term: you are aware of that?
  kind: phrase
  meaning: 你知道这件事吧？（确认对方已掌握某信息）
  examples:
  - You're aware of that, right? The cutoff moved to Friday.
  note: 比 "Do you know...?" 更中性正式，重点是"你有没有被告知"，不是"你懂不懂"。邮件里常写成 Please be aware that…
  source: Notion · Work
  added: "2026-07-29"
- term: be committed to sth
  kind: phrase
  meaning: 坚定地致力于……
  examples:
  - We are committed to that goal, and the resourcing reflects it.
  note: 后面接名词或动名词（committed to delivering）。语气比 we want to 重得多，带承诺性质，对外沟通要谨慎使用。
  source: Notion · Work
  added: "2026-07-29"
- term: I will continue with…
  kind: pattern
  meaning: 我先继续做……
  examples:
  - I'll continue with the migration script while you review the design.
  note: 表示不改变原计划。想强调"不管怎样还是要做"可以说 I'll carry on with…
  source: Notion · Work
  added: "2026-07-29"
- term: there isn't a ticket for it
  kind: phrase
  meaning: 这件事没有开单
  examples:
  - That work isn't tracked — there isn't a ticket for it.
  note: 意思是没进积压/看板，因此不会被排期。也说 it's not on the board / it's untracked。
  source: Notion · Work
  added: "2026-07-29"
- term: what exactly needs to be encrypted
  kind: phrase
  meaning: 到底哪些内容需要加密
  examples:
  - Before we scope this, what exactly needs to be encrypted?
  note: exactly 放在疑问词后面用来收窄范围，礼貌地逼对方给具体答案。
  source: Notion · Work
  added: "2026-07-29"
- term: our committed timeline
  kind: phrase
  meaning: 我们已经承诺的时间线
  examples:
  - That change would put our committed timeline at risk.
  note: committed 在这里指"已对外承诺、不能随便改"，比 planned timeline 分量重得多。
  source: Notion · Work
  added: "2026-07-29"
- term: my concern is…
  kind: pattern
  meaning: 我担心的是……
  examples:
  - My concern is that we're testing against stale data.
  note: 提反对意见最安全的开场白：把问题说成自己的顾虑，而不是指责对方的方案。
  source: Notion · Work
  added: "2026-07-29"
- term: let me try to work it out
  kind: phrase
  meaning: 我来想办法解决 / 算清楚
  examples:
  - Let me try to work it out and come back to you tomorrow.
  note: work out 既是"想出办法"也是"算出结果"。想强调只是先看看，可以说 let me have a look at it。
  source: Notion · Work
  added: "2026-07-29"
- term: I'm not following you
  kind: phrase
  meaning: 我没跟上你的意思
  examples:
  - Sorry, I'm not following you — which service returns the 500?
  note: 说"没听懂"最礼貌的方式，把责任放在自己身上。比 I don't understand 柔和很多。
  source: Notion · Work
  added: "2026-07-29"
- term: hit the milestone
  kind: phrase
  meaning: 达成里程碑
  examples:
  - We hit the milestone two days early.
  note: 口语里 hit 比 achieve 常见得多。没达成说 we missed the milestone。
  source: Notion · Work
  added: "2026-07-29"
- term: I don't have much to say
  kind: phrase
  meaning: 我这边没什么要补充的
  examples:
  - I don't have much to say this week — everything's on track.
  note: 站会轮到自己但没进展时的标准说法。近义 nothing much from me / nothing to flag。
  source: Notion · Work
  added: "2026-07-29"
- term: Are we being measured?
  kind: phrase
  meaning: 这个有被纳入考核吗？
  examples:
  - Are we being measured on this, or is it best-effort?
  note: be measured on sth 指"被拿这个指标考核"。问这句其实是在问优先级。
  source: Notion · Work
  added: "2026-07-29"
- term: be aligned on the scope
  kind: phrase
  meaning: 在某事上达成一致
  examples:
  - We're aligned on the scope; the timeline is still open.
  - Let's sync up Friday and align on the rollout plan.
  note: |-
    align 是职场高频词。想推动对齐说 let's align on…；确认是否一致说 are we aligned?
    和 agree 的区别：agree 是同意某个观点；aligned 强调各方方向一致，后续可以一起推进。
    sync up 是另一回事：强调同步彼此的进度和信息，通常是短会（vs meet 只是「开会」），所以常连着说 let's sync up and align on…。
  source: Notion · Work
  added: "2026-07-29"
- term: disseminate down
  kind: phrase
  meaning: （信息）向下传达、同步到下游
  examples:
  - Clearly it did not get disseminated down.
  - This message did not get disseminated down.
  note: |-
    这个变更没有被同步到下面的系统 / 下面的团队。语气正式，日常更常说 it didn't get passed down 或 the message didn't reach them。
    上层没有把消息向下传播。日常沟通更常说 it never made it down to the teams。
  source: Notion · Work
  added: "2026-07-29"
- term: in charge (of sth)
  kind: phrase
  meaning: 负责、主管
  examples:
  - Who's in charge of the release this week?
  note: 强调"有决定权"，不只是干活。只负责某块工作用 responsible for；正式归属用 own：Which team owns this?
  source: Notion · Work
  added: "2026-07-29"
- term: I'm not in a position to…
  kind: pattern
  meaning: 我不方便 / 无权……
  examples:
  - Unfortunately I'm not in a position to give a satisfactory answer to that question.
  note: 婉拒的高级说法，暗示"不是我不想，是我没这个立场/权限"，不必解释原因。
  source: Notion · Work
  added: "2026-07-29"
- term: compulsory for all engineers
  kind: phrase
  meaning: 规定了必须做，没得选（强制的、必修的）。
  examples:
  - The security training is compulsory for all engineers.
  note: |-
    vs mandatory / required：意思一样，compulsory 多见于英式以及教育、法规语境（compulsory education）；美式职场更常说 mandatory 或 required。反面是 optional / voluntary。
    常见：compulsory for sb、a compulsory reviewer（代码库里设成必须审批的那个人）。
  source: Notion · Work
  added: "2026-07-29"
- term: we need to adapt and develop new skills
  kind: phrase
  meaning: 我们需要适应并培养新技能
  examples:
  - The tooling changed, so we need to adapt and develop new skills.
  note: adapt to sth 是"适应某事"，adopt 是"采用"，两个词发音接近但意思完全不同，注意别写错。
  source: Notion · Work
  added: "2026-07-29"
- term: exempt sb from sth
  kind: phrase
  meaning: 豁免、免除某人某项要求
  examples:
  - We can exempt internal accounts from that rule.
  note: 形容词也是 exempt：Internal traffic is exempt. 名词是 exemption：请求豁免说 request an exemption。
  source: Notion · Work
  added: "2026-07-29"
- term: hop on a call
  kind: phrase
  meaning: 快速开个电话会
  examples:
  - Let's hop on a call — this is hard to explain over chat.
  note: hop 带"轻快、临时起意"的意味，比 schedule a meeting 随意得多。也说 jump on a call。
  source: Notion · Work
  added: "2026-07-29"
- term: run the business
  kind: phrase
  meaning: 日常运营（相对于创新项目）
  examples:
  - Half the team is on run-the-business work this quarter.
  note: 常和 change the business 对比：前者是维持现有运转（KPI、维护），后者是做新东西。也写作 RTB / BAU（business as usual）。
  source: Notion · Work
  added: "2026-07-29"
- term: I'm hoping to…
  kind: pattern
  meaning: 我希望能……
  examples:
  - I'm hoping to finish today.
  note: 进行时比 I hope to 更软，暗示"还不确定，别当承诺"。给不准的时间点时很好用。
  source: Notion · Work
  added: "2026-07-29"
- term: I have a request for you
  kind: phrase
  meaning: 我有件事想请你帮忙
  examples:
  - I have a request for you — could you review this before Friday?
  note: 正式的铺垫句，先打招呼再提要求。更轻松的说法是 I have a favour to ask。
  source: Notion · Work
  added: "2026-07-29"
- term: I would be able to advise that…
  kind: pattern
  meaning: 我可以正式告知您……
  examples:
  - I would be able to advise that the issue appears to have been resolved.
  note: 客服/对外沟通的正式措辞，基于当前确认结果给出答复。内部沟通说 I can confirm that… 就够了。
  source: Notion · Work
  added: "2026-07-29"
- term: bear in mind that…
  kind: pattern
  meaning: 请记住、要注意
  examples:
  - Bear in mind that this is a temporary mitigation.
  note: 用来提醒对方一个容易被忽略的前提。近义 keep in mind；更正式的是 please note that。
  source: Notion · Work
  added: "2026-07-29"
- term: just to make sure I understand…
  kind: pattern
  meaning: 我确认一下我的理解……
  examples:
  - Just to make sure I understand, these cases are all from the same merchant?
  note: 复述对方观点前的黄金句式，既确认信息又不显得质疑对方。近义 let me play that back to you。
  source: Notion · Work
  added: "2026-07-29"
- term: at a high level
  kind: phrase
  meaning: 从宏观上、粗略地讲
  examples:
  - At a high level, we're splitting the service in two.
  note: |-
    表示"先讲大概，细节后面说"。反面是 in the weeds（陷在细节里）。
    和 roughly / generally 的区别：roughly 是不精确；at a high level 是故意先不讲细节，只讲架构和骨架。
  source: Notion · Work
  added: "2026-07-29"
- term: what would really help me is…
  kind: pattern
  meaning: 对我最有帮助的是……
  examples:
  - What would really help me is a clear timeline.
  note: 把要求包装成"你这样做我会很受益"，比 I need… 更容易被接受。
  source: Notion · Work
  added: "2026-07-29"
- term: I'll come back to you on this one
  kind: phrase
  meaning: 这个我回头答复你
  examples:
  - I don't have that number handy — I'll come back to you on this one.
  note: 当场答不上来时最体面的说法，暗示"我会去查"。近义 let me get back to you。
  source: Notion · Work
  added: "2026-07-29"
- term: on track
  kind: phrase
  meaning: 按计划推进中
  examples:
  - The project is on track so far.
  note: 进度正常。落后是 behind schedule / slipping，有风险是 at risk，提前是 ahead of schedule。
  source: Notion · Work
  added: "2026-07-29"
- term: have high hopes for sb
  kind: pattern
  meaning: 很看好某人、对某人期待很高。
  examples:
  - I have high hopes for you on this project.
  note: hopes 侧重"看好、期待你做成"，expectations 侧重"我要求你做到"。后者压力更大，注意场合。
  source: Notion · Work
  added: "2026-07-29"
- term: be on the same page
  kind: phrase
  meaning: 意见一致、理解一致
  examples:
  - I want to check whether we're on the same page regarding the scope.
  note: 强调"理解一致"，align 更强调"目标方向一致"。不一致说 we're not on the same page。
  source: Notion · Work
  added: "2026-07-29"
- term: at an early stage
  kind: phrase
  meaning: 处于早期阶段
  examples:
  - It's still at an early stage, so the numbers will move.
  note: 常用来预防对方过度解读初步结果。近义 it's still early days（更口语）。
  source: Notion · Work
  added: "2026-07-29"
- term: be on board
  kind: phrase
  meaning: 同意、支持
  examples:
  - Josh is on board. （= Josh has agreed.）
  note: |-
    比喻"上了同一条船"。争取支持说 get sb on board；引导新人入职是 onboard sb（一个词，动词）。
    和 agree 的区别：agree 只是同意；on board 是加入进来，会一起支持和推进。
  source: Notion · Work
  added: "2026-07-29"
- term: it would appear (that)…
  kind: pattern
  meaning: 看起来似乎……
  examples:
  - Each transaction, it would appear, is coming through multiple times.
  note: 比 it seems 更委婉正式，用于给出还没坐实的观察。插在句中要用逗号隔开。
  source: Notion · Work
  added: "2026-07-29"
- term: that's a bit of the update from our side
  kind: phrase
  meaning: 这就是我们这边的进展
  examples:
  - That's a bit of an update from our side; happy to take questions.
  note: 汇报收尾的软性说法，a bit of 是自谦。更利落的收尾：that's all from us。
  source: Notion · Work
  added: "2026-07-29"
- term: from my perspective
  kind: phrase
  meaning: 从我站的位置看到的样子（在我看来）。
  examples:
  - From my perspective, the risk is acceptable.
  - From our perspective, the data looks clean.
  note: |-
    表明这是个人视角、不代表结论。注意别写成 in my perspective，正确介词是 from。
    从我们的角度看 跨团队沟通时给结论加上限定，暗示"我们只能看到自己这一侧"，留了余地。
    和 in my opinion 的区别：in my opinion 是个人观点；from my perspective 强调这是站在我的位置看到的，暗示换个位置可能看到不同的东西。
  source: Notion · Work
  added: "2026-07-29"
- term: what's the timing on…?
  kind: pattern
  meaning: ……的时间安排是怎样的？
  examples:
  - What's the timing on those requests?
  note: 既可以问"什么时候做"，也可以问"耗时多久"。想问具体时刻用 when exactly；想问耗时用 how long does it take。
  source: Notion · Work
  added: "2026-07-29"
- term: drop sth in the chat
  kind: phrase
  meaning: 把某样东西发到聊天框
  examples:
  - Can you drop the link in the chat?
  note: |-
    线上会议高频句。同义替换：pop it in the chat（更英式）、put an example in the chat。
    和 send / share 的区别：send 中性；drop 轻快随意，像顺手丢过去，适合会议里的临时分享。
  source: Notion · Work
  added: "2026-07-29"
- term: I'll keep you posted
  kind: phrase
  meaning: 我会随时向你通报进展
  examples:
  - I'll keep you posted as things progress.
  note: 事故沟通的标配。近义 I'll keep you in the loop（让你保持知情）、I'll update you as I go。
  source: Notion · Work
  added: "2026-07-29"
- term: ready to go
  kind: phrase
  meaning: 准备就绪
  examples:
  - I'll let you know when it's ready to go.
  note: 指万事俱备可以开始/发布。近义 good to go（更口语，常用来给放行）：You're good to go.
  source: Notion · Work
  added: "2026-07-29"
- term: just a heads-up
  kind: phrase
  meaning: 先提个醒
  examples:
  - 'Just a heads-up: the meeting has been moved to 3pm.'
  note: |-
    名词连字符写 heads-up，动词分开写 give sb a heads-up。语气轻，表示"不需要你做什么，只是让你知道"。
    和 FYI / please note 的区别：FYI 是缩写，偏书面；please note 正式、像通知；heads-up 的画面是让你抬头注意一下，提前知道好有准备，最友好。
  source: Notion · Work
  added: "2026-07-29"
- term: my inbox is out of control
  kind: phrase
  meaning: 我的邮箱已经失控了
  examples:
  - My inbox is a little out of control; I haven't been able to get through them yet.
  note: 解释回复慢的常见说法，带自嘲。近义 I'm drowning in emails / I'm behind on email。
  source: Notion · Work
  added: "2026-07-29"
- term: I'm afraid that doesn't exist
  kind: phrase
  meaning: 恐怕没有这个东西
  examples:
  - I'm afraid that doesn't exist in the current API.
  note: I'm afraid 是给坏消息的缓冲，和"害怕"无关。近义 unfortunately，但 I'm afraid 更适合口语。
  source: Notion · Work
  added: "2026-07-29"
- term: I wasn't aware of that
  kind: phrase
  meaning: 我之前不知道这件事
  examples:
  - I wasn't aware of that — thanks for flagging it.
  note: 中性地承认信息缺口，不含歉意也不含指责。比 nobody told me 得体得多。
  source: Notion · Work
  added: "2026-07-29"
- term: I'm still following up
  kind: phrase
  meaning: 我还在跟进
  examples:
  - I'm still following up with the vendor on that.
  note: follow up 是"跟进"的标准说法，后接 with sb（找谁）或 on sth（跟进什么事）。名词连写：a follow-up。
  source: Notion · Work
  added: "2026-07-29"
- term: go off topic
  kind: phrase
  meaning: 跑题
  examples:
  - I think we've gone too far off topic.
  note: 拉回话题可以接 let's take that offline（这个我们会后单聊），是会议主持的高频组合。
  source: Notion · Work
  added: "2026-07-29"
- term: liaise with
  kind: phrase
  meaning: 联络对接
  examples:
  - I'm liaising with the other team on the schedule.
  note: 英式常用，指作为接口人持续沟通协调，比 talk to 更有职责感。名词 liaison：He's our liaison with legal.
  source: Notion · Work
  added: "2026-07-29"
- term: how are you getting on with…?
  kind: pattern
  meaning: ……进展怎么样？
  examples:
  - How are you getting on with your project?
  note: 英式说法，既可问进度也可问相处（How are you getting on with the new team?）。美式更常说 How's it going with…?
  source: Notion · Work
  added: "2026-07-29"
- term: is now a good time?
  kind: phrase
  meaning: 现在方便吗？
  examples:
  - Is now a good time, or should I come back later?
  note: 打断别人前的标准礼貌问法。更委婉：Do you have a minute? / Is this a bad time?
  source: Notion · Work
  added: "2026-07-29"
- term: not least
  kind: phrase
  meaning: 这可绝不是最次要的一条（尤其是、特别是）。用否定「least」的方式反着强调 —— 我列了一堆理由，这个分量最重。
  examples:
  - It's an expensive city, not least because of the rent.
  note: |-
    vs especially：意思一样，但 especially 是直接说「特别是」；not least 用反话来抬高它，语气更正式、更有分寸，适合书面说理 —— 前面铺了几条理由之后，用它点出真正关键的那条。
    常见搭配就两个：not least because…（尤其因为）、not least in/for…。
    ❌ 别和 last but not least 混 —— 那是列举收尾时的客套话（最后一个但同样重要），位置和功能都不同。
  source: Notion · Daily
  added: "2026-07-29"
- term: as per
  kind: phrase
  meaning: 根据、按照（正式）
  examples:
  - His contract, as per the offer, runs till Dec 2026.
  note: 合同、邮件里的正式用词。口语和普通邮件用 according to 或直接说 based on 更自然，as per 用多了显得刻板。
  source: Notion · Work
  added: "2026-07-29"
- term: a concept whereby …
  kind: pattern
  meaning: 借此、由此（= by which）
  examples:
  - It has this concept of campaigns, whereby it will persist all the context.（真实转录）
  - engineers usually use AI as engine, whereby you just do a question and answer, one task at a time（真实转录）
  note: |-
    where（在那里）+ by（凭借）= 凭借这个东西，于是……。所以它引出的永远是「这个机制带来的结果」：a process whereby every change is reviewed。
    vs where / in which：意思接近，但 whereby 专门强调"靠它运作"这层因果，不只是定位；书面感也重得多。
    vs and that way：口语里就说这个，或干脆 so。邮件里 whereby 用多了很刻板。
    ❌ 不能单独起句（Whereby we will…），必须挂在前面的名词后面。
  source: Notion · Work
  added: "2026-07-29"
- term: is it occurring, or has it been occurring
  kind: pattern
  meaning: 发生（正式）
  examples:
  - Is this just occurring in the last four hours, or has it been occurring for a while?
  note: 事故沟通里比 happen 正式。注意时态对比：现在进行时问"正在发生"，现在完成进行时问"持续了多久"。
  source: Notion · Work
  added: "2026-07-29"
- term: mount a challenge
  kind: phrase
  meaning: 发起挑战
  examples:
  - Mounting an effective challenge to Google will still be tough.
  note: mount 在这里是"组织并发起"，常搭配 mount a campaign / defence / challenge。比 make a challenge 正式且有力。
  source: Notion · Work
  added: "2026-07-29"
- term: maiden name
  kind: phrase
  meaning: （女性）婚前姓
  examples:
  - What's your maiden name?
  note: 常见于银行和证件的安全问题。婚后改的姓叫 married name；不改姓叫 keep her maiden name。
  source: Notion · Daily
  added: "2026-07-29"
- term: breakout room
  kind: phrase
  meaning: 分组讨论会议室
  examples:
  - We'll split into breakout rooms for the next 20 minutes.
  note: 线上会议的分组功能。动词是 break out into groups。
  source: Notion · Work
  added: "2026-07-29"
- term: business justification
  kind: phrase
  meaning: 商业/业务层面的合理依据
  examples:
  - What's the business justification for this change?
  note: 问这句是在要"为什么值得投入"，答案要落在收入、成本、风险、合规上，不能只讲技术优雅。
  source: Notion · Work
  added: "2026-07-29"
- term: open questions
  kind: phrase
  meaning: 尚未解决的问题
  examples:
  - If there are any other open questions, we can also address them with the vendor.
  note: 指"还没有答案、需要跟进"的问题清单。会议纪要里常与 action items、decisions 并列。
  source: Notion · Work
  added: "2026-07-29"
- term: laid off
  kind: phrase
  meaning: 被裁员 —— 最标准、最中性的说法，点明这是公司层面的决定。
  examples:
  - I was laid off as part of a company-wide restructuring.
  note: |-
    lay off 本义是「把人先放下来」（原本还暗示以后可能再叫回来），所以听起来不是你的错，是公司这边的决定。
    vs fired：fired 是因过失被开除，性质完全不同，面试里说错一个字就变成污点。
    ❌ I was layoff（名词当动词）→ ✅ I was laid off / There were layoffs。
  source: English Teacher · 被裁员的英文表达
  added: "2026-07-28"
- term: made redundant
  kind: phrase
  meaning: 职位被裁撤。英式和新加坡职场更常用，听起来更正式。
  examples:
  - My position was made redundant.
  note: 和 laid off 的区别：redundant 是「多余的」，字面意思是这个岗位不再需要了。焦点在岗位被取消，比 laid off 更强调「不是我的问题，是岗位没了」，所以听起来更正式、体面。
  source: English Teacher · 被裁员的英文表达
  added: "2026-07-28"
- term: the project was descoped
  pos: v.
  kind: phrase
  meaning: 把项目范围砍掉一部分。比任何带 terminate 的说法都好听。
  examples:
  - The project I was contracted for was descoped.
  note: 为什么比 terminate 好听：主语是项目（the project was descoped），对方听到的是「活被砍了」，而不是「你被终止了」，不会联想到个人表现。
  source: English Teacher · 被裁员的英文表达
  added: "2026-07-28"
- term: restructuring / downsizing
  pos: n.
  kind: phrase
  meaning: 公司重组／缩编。用来委婉说明裁员的原因。
  examples:
  - I was affected by a company-wide restructuring.
  note: 和直接说 layoffs / cutting jobs 的区别：这两个词把焦点从「裁人」挪到「公司在调整」，所以更委婉。二者本身也不同：restructuring 是组织调整，不一定裁员；downsizing 明确是规模缩小。
  source: English Teacher · 被裁员的英文表达
  added: "2026-07-28"
- term: fixed-term contract
  kind: phrase
  meaning: 定期合同。合同到期没续时最干净的说法。
  examples:
  - It was a fixed-term contract that wasn't renewed.
  note: 和 temporary contract 的区别：fixed-term 强调结束日期一开始就约定好了，到期不续是合同自然结束，不是被终止；temporary 听起来更像临时工、不稳定。
  source: English Teacher · 被裁员的英文表达
  added: "2026-07-28"
- term: require sponsorship
  pos: n.
  kind: phrase
  meaning: 公司出面当担保人、替你扛下办签证这件事（工作签证担保）。
  examples:
  - Do you require sponsorship now or in the future?
  note: |-
    sponsor 本义是「出钱出面撑着你的人」（赞助商同一个词）。签证语境里，撑你的是雇主：申请是公司提的，责任在公司身上，不是你自己去办。
    vs visa support / visa help：招聘表格里一律写 sponsorship，因为问的是法律上的担保责任，不是「帮不帮忙」。
    问句要看清主语是你：Do you require sponsorship? = 你需不需要我们担保。需要就答 Yes（不是「我有签证吗」）。
  source: English Teacher · Given names in Western script
  added: "2026-07-22"
- term: given name / family name
  kind: phrase
  meaning: 名／姓。表格里 Western Script 指用护照上的拼音填。
  examples:
  - 'Given Name(s) – Western Script: Wei · Family Name: Zhang'
  note: 和 first name / last name 的区别：表格用 given / family，是因为姓名顺序因文化而异。中文名字姓在前，用 first / last 会有歧义；given / family 按含义区分，不看位置。
  source: English Teacher · Given names in Western script
  added: "2026-07-22"
- term: drive adoption
  kind: phrase
  meaning: 在后面一直推着，让大家真的开始用起来（推动落地、推广）。
  examples:
  - driving its adoption company-wide
  note: |-
    adoption 是「接纳、采用」—— 东西做出来只是第一步，别人愿意换过来才算数。drive 是持续施力，不是一次性动作。
    vs introduce：introduce 只管「引入」，摆出来就结束了，没人用也算做过；drive adoption 承诺的是最后真有人用。
    vs enforce：enforce 是强制、不用不行；drive 是靠推广、说服、做样板，柔和得多。简历里描述推行内部工具、规范首选它。
  source: English Teacher · Condensing slow SQL optimization
  added: "2026-07-20"
