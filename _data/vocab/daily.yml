# 生词本 · daily
# 字段见 _data/vocab_meta.yml 顶部注释。新词加在最上面（按 added 倒序）。

- term: as in
  kind: phrase
  meaning: 我的意思是、也就是说。用来澄清刚才说的话。
  examples:
  - As in, we help collect donations from the guests.
  note: 另一个用法是拼写确认："My name is Kate, as in K-A-T-E."
  source: English Teacher · Collecting donations at dinner events
  added: "2026-09-10"
- term: help collect
  kind: phrase
  meaning: 帮忙收（款）。口语里 help + 动词原形比 help to 更自然。
  examples:
  - We help collect donations from the guests.
  source: English Teacher · Collecting donations at dinner events
  added: "2026-09-10"
- term: Get some sleep / Get some rest
  kind: phrase
  meaning: 早点休息吧。
  examples:
  - Don't work too late — get some rest.
  note: ❌ 别说 Rest early，母语者不这么讲。
  source: English Teacher · 早点休息的英文表达
  added: "2026-09-10"
- term: go about doing sth
  kind: phrase
  meaning: 着手做某事、用什么方法做。问的是路径，不是要不要做。
  examples:
  - How do you go about testing that?
  note: 暗含「这事听起来不好办，你从哪儿下手？」回答要讲步骤，不要只给结论。
  source: English Teacher · Understanding English phrase meaning
  added: "2026-09-04"
- term: see someone around
  kind: phrase
  meaning: 平时在附近偶然碰见过，只是眼熟，不是正式认识。
  examples:
  - I don't think I'm trying to recall if I saw you around.
  note: recall = 回想起来。
  source: English Teacher · Understanding English phrase meaning
  added: "2026-09-04"
- term: commission
  pos: n. / v.
  kind: word
  meaning: 佣金；委员会；委托创作；使投入使用。日常商务里最常见的是「提成」。
  examples:
  - He works on commission.
  note: decommission = 退役、关停。
  source: English Teacher · Commission 的多个含义
  added: "2026-09-03"
- term: garbled
  pos: adj.
  kind: word
  meaning: （信号／声音）失真、乱掉，听不清。
  examples:
  - I think the connection garbled things a bit there — I only caught fragments.
  note: catch fragments = 只听到零碎几句。
  source: English Teacher · Greeting with confusion
  added: "2026-09-03"
- term: decadent
  ipa: /ˈdekədənt/
  pos: adj.
  kind: word
  meaning: ① 堕落颓废的（贬）② 奢华诱人、好吃到有负罪感（褒／戏谑）。
  examples:
  - a decadent chocolate cake
  note: 说人和社会时多半是批评，说食物和享受时是赞美。
  source: English Teacher · Decadent的含义
  added: "2026-08-22"
- term: play around with
  pos: v.
  kind: phrase
  meaning: 摆弄、鼓捣、随便试试。语气轻松，不是正经研究。
  examples:
  - I've been playing around with the new app.
  note: 不带宾语说人 is playing around 时，可能是「乱搞男女关系」，看语境。
  source: English Teacher · Play around的多个含义
  added: "2026-08-07"
- term: Was it … who …?
  kind: pattern
  meaning: 强调句型 It is/was + 被强调部分 + who/that，对应中文「是……的吗」。
  examples:
  - Was it the florist who told you this?
  note: florist 偏指花店老板；街边卖花的说 flower seller。
  source: English Teacher · 英文强调句型表达
  added: "2026-08-07"
- term: on top of it
  kind: phrase
  meaning: 掌控住、跟得上（职场最常用）。
  examples:
  - Don't worry, I'm on top of it.
  note: 另两义：on top of that = 除此之外（叠加坏消息）；字面 = 在它上面。
  source: English Teacher · On top of it 是什么意思
  added: "2026-08-06"
- term: stay on top of things
  kind: phrase
  meaning: 把事情都盯住、不落下。面试答「怎么管理多任务」很好用。
  examples:
  - I keep a simple daily log so I stay on top of what's in progress.
  source: English Teacher · On top of it 是什么意思
  added: "2026-08-06"
- term: board the plane
  pos: v.
  kind: phrase
  meaning: 登机。机场广播和正式场合都用这个。
  examples:
  - We'll start boarding in 20 minutes.
  note: 口语说 get on the plane。大交通工具用 get on，轿车出租车才用 get in。
  source: English Teacher · 飞机登机的英文表达
  added: "2026-08-06"
- term: boarding pass / gate / final call
  kind: phrase
  meaning: 登机牌／登机口／最后登机广播。
  examples:
  - Final call for passengers on flight SQ806.
  note: 下飞机：get off the plane，正式说 deplane。
  source: English Teacher · 飞机登机的英文表达
  added: "2026-08-06"
- term: it'd be a real shame
  kind: phrase
  meaning: 那就太可惜了（感情色彩上的遗憾）。
  examples:
  - Otherwise, it'd be a real shame.
  note: 强调「浪费」用 such a waste；强调「错失机会」用 a missed opportunity。
  source: English Teacher · 英文表达"太可惜了"
  added: "2026-08-06"
- term: manifest
  pos: v.
  kind: word
  meaning: 使显现、把抽象的东西变成现实。
  examples:
  - Manifest your dream.
  note: 作形容词是「明显的」(a manifest error)，作名词是「货物清单」。
  source: English Teacher · 单机系统的中文表达
  added: "2026-08-06"
- term: I knew I would regret it if I didn't speak to her
  kind: pattern
  meaning: 我知道不跟她说话我会后悔
  examples:
  - I knew I would regret it if I didn't speak to her.
  note: 原笔记写的 if I wouldn't have spoken 是常见错句：if 从句里不用 would。虚拟语气正确写法是 if I hadn't spoken to her, I would have regretted it。
  source: Notion · Daily
  added: "2026-07-29"
- term: all of them
  kind: pattern
  meaning: 全部、所有这些
  examples:
  - Which ones do you want? — All of them.
  note: 注意 all of them 后面必须是代词或带限定词的名词（all of the files），直接说 all files 时不加 of。
  source: Notion · Daily
  added: "2026-07-29"
- term: it was ready
  kind: phrase
  meaning: 已经准备好了
  examples:
  - By the time we arrived, dinner was ready.
  note: ready 描述状态而非动作。人也可以 ready：Are you ready to go? 强调"随时可以"用 ready to go。
  source: Notion · Daily
  added: "2026-07-29"
- term: other than that
  kind: phrase
  meaning: 除此之外
  examples:
  - The room was small. Other than that, the hotel was great.
  note: 用来把一个例外圈出来，剩下的一概肯定。近义 apart from that（英式）、besides that。放句首要加逗号。
  source: Notion · Daily
  added: "2026-07-29"
- term: these things
  kind: phrase
  meaning: 这些事情
  examples:
  - These things take time.
  note: 原笔记记成 these think，是听音误记。These things take time 是很好用的安慰句，意思是"这种事急不来"。
  source: Notion · Daily
  added: "2026-07-29"
- term: be sick of sth
  kind: phrase
  meaning: 厌倦、受够了
  examples:
  - I'm sick of eating the same thing every day.
  note: 后接名词或动名词。程度递增：tired of（有点烦）< sick of（受够了）< sick and tired of（忍无可忍）。
  source: Notion · Daily
  added: "2026-07-29"
- term: it's never-ending
  kind: phrase
  meaning: 没完没了
  examples:
  - The laundry is never-ending.
  note: 形容词写作 never-ending。抱怨重复性琐事时最常用。近义 it never stops / there's no end to it。
  source: Notion · Daily
  added: "2026-07-29"
- term: intertwined
  kind: word
  meaning: 交织在一起、密不可分
  examples:
  - Their lives have been intertwined since childhood.
  - Billing and entitlements are so intertwined that we can't ship them separately.
  note: |-
    字面是"缠绕在一起"，抽象用法指关系或事情纠缠难分。比 connected 强得多。
    交织在一起、互相缠绕难以分开 比 coupled 更强，暗示"缠得已经理不清"。工程语境常说 tightly coupled。
  source: Notion · Daily + Notion · Work
  added: "2026-07-29"
- term: vicious cycle
  kind: phrase
  meaning: 恶性循环
  examples:
  - I sleep badly, so I drink more coffee, so I sleep badly — a vicious cycle.
  note: 反面是 virtuous cycle（良性循环）。注意别拼成 viscous（黏稠的），这两个词长得很像。
  source: Notion · Daily
  added: "2026-07-29"
- term: try it out
  kind: phrase
  meaning: 试一试
  examples:
  - The new place opened downstairs — let's try it out.
  note: out 强调"实际用一次看看效果"。试穿衣服是 try it on，两者别混。
  source: Notion · Daily
  added: "2026-07-29"
- term: distribute vs disturb
  kind: contrast
  meaning: 分发 vs 打扰
  examples:
  - Could you distribute the handouts? / Sorry to disturb you.
  note: 两个词只是长得像，意思毫无关系。酒店门牌上的 Do not disturb 就是这个 disturb。
  source: Notion · Daily
  added: "2026-07-29"
- term: more of
  kind: phrase
  meaning: 更偏向于、更像是
  examples:
  - It's more of a hobby than a job.
  note: more of a A than a B 是很好用的句型，用来修正对方的定性，而不是直接否定。
  source: Notion · Daily
  added: "2026-07-29"
- term: by the time
  kind: phrase
  meaning: 等到……的时候
  examples:
  - By the time we got there, the kitchen had closed.
  - By the time we got there, it was around 6 or 7 in the morning.
  note: |-
    后面接从句且不用将来时（By the time you arrive, I'll have finished）。主句常配完成时，因为强调"在那之前已经发生"。
    后接从句，主句常用完成时表示"在那之前已发生"。注意 by the time 后不用将来时。
  source: Notion · Daily
  added: "2026-07-29"
- term: dwindle
  kind: word
  meaning: 逐渐减少
  examples:
  - Might I also add, the number of drinking friends has been dwindling.
  note: 强调"慢慢变少"的过程，常用进行时。近义 shrink（体积缩小）、taper off（逐渐停止）。
  source: Notion · Daily
  added: "2026-07-29"
- term: ignorance is bliss
  kind: phrase
  meaning: 不知道反而幸福
  examples:
  - I didn't read the reviews before going. Ignorance is bliss.
  note: 固定谚语，多用于自嘲。完整原句是 where ignorance is bliss, 'tis folly to be wise。
  source: Notion · Daily
  added: "2026-07-29"
- term: it doesn't sit right with me
  kind: phrase
  meaning: 我总觉得这样不太对
  examples:
  - Something about that deal doesn't sit right with me.
  note: 表达直觉上的不适，说不出具体理由。比 I disagree 柔和，适合提出模糊但真实的顾虑。
  source: Notion · Daily
  added: "2026-07-29"
- term: I'm still around
  kind: phrase
  meaning: 我还在（没走）
  examples:
  - I'm still around if you need anything.
  note: around 指"在附近、还在线"。下班道别常说 I'm around tomorrow if you need me。
  source: Notion · Daily
  added: "2026-07-29"
- term: come across sth
  kind: phrase
  meaning: 偶然发现、无意中看到
  examples:
  - I went into the library this afternoon to have a look at a newspaper and I came across something really interesting.
  note: 强调"不是刻意找的"。come across as 是另一个意思：给人留下某种印象（He comes across as shy）。
  source: Notion · Daily
  added: "2026-07-29"
- term: shall we … then?
  kind: pattern
  meaning: 那我们就……吧？
  examples:
  - So everything is ready — shall we go then?
  note: 句末的 then 承接前面的结论，起推进作用，相当于"那就……"。英式口语高频。
  source: Notion · Daily
  added: "2026-07-29"
- term: spoil ourselves
  kind: phrase
  meaning: 犒劳一下自己、享受一下
  examples:
  - We've been working hard — let's spoil ourselves this weekend.
  note: 也说 treat ourselves（更常用）。注意 spoil a child 是"宠坏孩子"，spoil the ending 是"剧透"。
  source: Notion · Daily
  added: "2026-07-29"
- term: refreshments
  kind: word
  meaning: 茶点、简单饮食
  examples:
  - Free refreshments will be provided.
  note: 指会议或活动上提供的饮料点心，不是正餐。只有复数形式，正式场合的固定用词。
  source: Notion · Daily
  added: "2026-07-29"
- term: that sounds like a bargain
  kind: phrase
  meaning: 听起来很划算
  examples:
  - Twenty dollars for all that? That sounds like a bargain to me.
  note: bargain 作名词是"划算的买卖"。近义 a good deal、a steal（便宜得离谱）。
  source: Notion · Daily
  added: "2026-07-29"
- term: keen
  kind: word
  meaning: 有兴趣的、热衷的
  examples:
  - So what else? I'm feeling quite keen now.
  note: 英式常用，美式更爱说 excited / eager。keen on sth 是"喜欢某事"：I'm not keen on spicy food.
  source: Notion · Daily
  added: "2026-07-29"
- term: if only…
  kind: pattern
  meaning: 要是……就好了
  examples:
  - If only I had more time.
  note: 表达不能实现的愿望，后面用过去式（现在）或过去完成时（过去）。也可以单独说一句 If only. 表示"要是能这样就好了"。
  source: Notion · Daily
  added: "2026-07-29"
- term: a consuming passion
  kind: phrase
  meaning: 强烈到占据全部心思的热爱
  examples:
  - My consuming passion for cycling keeps me training every day.
  note: consuming 字面是"吞噬性的"，形容爱好几乎占满生活。近义 all-consuming。
  source: Notion · Daily
  added: "2026-07-29"
- term: go for sth
  kind: phrase
  meaning: 选择、决定要
  examples:
  - So I think we'll go for the Main Hall. How much would that cost?
  note: 点餐、选方案都能用：I'll go for the fish. 这里用 would 而不是 does，因为还没最终决定，是假设性询问。
  source: Notion · Daily
  added: "2026-07-29"
- term: it's got
  kind: pattern
  meaning: 它有（英式口语）
  examples:
  - It's got very good facilities — good quality cookers and fridges and so on.
  note: have got 在英式口语里比 have 更常用，强调现在拥有的状态。美式更常直接说 it has。
  source: Notion · Daily
  added: "2026-07-29"
- term: sort sth out
  kind: phrase
  meaning: 处理好、搞定
  examples:
  - That's Mr Evans — he'll sort that out with you.
  note: 英式高频动词短语，涵盖"安排、解决、整理"。美式更常说 take care of it / figure it out。
  source: Notion · Daily
  added: "2026-07-29"
- term: out of
  kind: phrase
  meaning: 从……里面（拿走）
  examples:
  - I had some things stolen out of my bag yesterday.
  - They're a practical way to get more out of longer Claude Code sessions.
  note: |-
    强调"从容器内部取出"，比单用 from 更具体。报案的标准说法：I want to report a theft.
    引申：从某样东西里得到价值——get more / the most / a lot out of sth（见 tech 场景的 get more out of）。
  source: Notion · Daily
  added: "2026-07-29"
- term: come over
  kind: phrase
  meaning: 过来（到我这里）
  examples:
  - Do you want to come over tonight? / Come over when you're free.
  note: 特指来说话人所在的地方，通常是家里。去别人那儿用 go over；随便逛过去用 drop by / pop over。
  source: Notion · Daily
  added: "2026-07-29"
- term: get out to somewhere
  kind: phrase
  meaning: （特意）跑到较远的地方去
  examples:
  - There are some really lovely things around here, but you need to get out to the small towns.
  note: out 强调"离开市区、路途不近"。近义 venture out。语气上暗示"值得专门跑一趟"。
  source: Notion · Daily
  added: "2026-07-29"
- term: drop sth off
  kind: phrase
  meaning: 顺路送到、放下
  examples:
  - We went to see friends, we dropped off the food, and now we're going to head home.
  note: 指把东西（或人）送到某地就走。接人是 pick sb up，两者是一对。
  source: Notion · Daily
  added: "2026-07-29"
- term: compliment sb on sth
  kind: phrase
  meaning: 称赞某人某方面
  examples:
  - He complimented her on her dress.
  note: 注意拼写：compliment 是称赞，complement 是补足、搭配得好。发音相同，意思完全不同。
  source: Notion · Daily
  added: "2026-07-29"
- term: hide and seek
  kind: phrase
  meaning: 捉迷藏
  examples:
  - We're playing hide and seek.
  note: 固定搭配不加冠词。玩这个游戏用 play hide and seek。
  source: Notion · Daily
  added: "2026-07-29"
- term: it's not as useful as it could be
  kind: pattern
  meaning: 它本可以更有用
  examples:
  - The app works, but it's not as useful as it could be.
  note: not as … as it could be 是很委婉的批评方式：不说"不好"，只说"没发挥出应有的水平"。
  source: Notion · Daily
  added: "2026-07-29"
- term: outspoken
  kind: word
  meaning: 直言不讳的
  examples:
  - She's quite outspoken in meetings.
  note: 中性偏褒，指敢公开表达看法。贬义的"说话不过脑"是 blunt 或 tactless。
  source: Notion · Daily
  added: "2026-07-29"
- term: what is there to do?
  kind: pattern
  meaning: 有什么可以玩的？
  examples:
  - We're in town for the weekend — what is there to do?
  note: 问当地活动的固定句型。也可以说 What's there to do around here? 回答常用 There's plenty to do.
  source: Notion · Daily
  added: "2026-07-29"
- term: fulfillment
  kind: word
  meaning: 成就感；履行
  examples:
  - She finds fulfillment in her work. / the fulfilment of a promise
  note: 两个意思：内心的满足感，以及承诺、订单的履行。英式拼 fulfilment，美式拼 fulfillment。
  source: Notion · Daily
  added: "2026-07-29"
- term: maiden name
  kind: phrase
  meaning: （女性）婚前姓
  examples:
  - What's your maiden name?
  note: 常见于银行和证件的安全问题。婚后改的姓叫 married name；不改姓叫 keep her maiden name。
  source: Notion · Daily
  added: "2026-07-29"
- term: I was going to ask you…
  kind: pattern
  meaning: 我本来想问你……
  examples:
  - I was going to ask you if you're free tomorrow.
  note: was going to 表示"原本打算"，用来软化提问，听起来不那么突兀。近义 I meant to ask you…
  source: Notion · Daily
  added: "2026-07-29"
- term: be scattered all over…
  kind: phrase
  meaning: 分散在各地
  examples:
  - They're all my college friends, but they're scattered all over the country.
  note: scatter 是"撒开、分散"，被动形式描述人分布在很多地方。近义 spread out across。
  source: Notion · Daily
  added: "2026-07-29"
- term: more or less
  kind: phrase
  meaning: 差不多、基本上
  examples:
  - The report is more or less finished.
  note: 用来给陈述留余地，避免把话说死。近义 pretty much（更口语）、roughly（偏数量）。
  source: Notion · Daily
  added: "2026-07-29"
- term: come up with sth
  kind: phrase
  meaning: 想出（办法、点子）
  examples:
  - She came up with a great idea.
  note: 强调"从无到有想出来"。注意过去式是 came up with，原笔记漏了时态。近义 think of（更随意）。
  source: Notion · Daily
  added: "2026-07-29"
- term: props
  kind: word
  meaning: 赞扬、认可
  examples:
  - Props to the team for turning that around so fast.
  note: 来自 proper respect，年轻化的口语。近义 kudos、hats off to。正式场合仍用 credit goes to…
  source: Notion · Daily
  added: "2026-07-29"
- term: intend to do sth
  kind: phrase
  meaning: 打算做某事
  examples:
  - I was intending to call you yesterday.
  note: 过去进行时 was intending 暗示"本来打算但没做成"，常用来道歉。比 I wanted to 更正式一点。
  source: Notion · Daily
  added: "2026-07-29"
- term: spray
  kind: word
  meaning: 喷（液体）
  examples:
  - She sprayed the perfume. / mosquito spray
  note: 动词和名词同形。日常搭配：sunscreen spray（防晒喷雾）、bug spray（驱蚊液）。原笔记 mosquite 应作 mosquito。
  source: Notion · Daily
  added: "2026-07-29"
- term: I can't remember exactly
  kind: phrase
  meaning: 我记不太清了
  examples:
  - I can't remember exactly, but it was around 2019.
  note: 承认记不清但仍给个大概，比单说 I don't know 有用。搭配 around / roughly 一起用最自然。
  source: Notion · Daily
  added: "2026-07-29"
- term: welp
  kind: word
  meaning: 行吧、那好吧
  examples:
  - Welp, I guess we'll try again tomorrow.
  note: well 的口语变体，表示接受一个不太理想的结果，带一点认命的幽默。只用于非正式场合。
  source: Notion · Daily
  added: "2026-07-29"
- term: other than / apart from
  kind: phrase
  meaning: 除了（= except）
  examples:
  - I didn't listen to much other than when she was addressing me directly.
  note: address 的本义是"把东西朝某个对象送过去"：对人是"向某人讲话"，对事是"处理某件事"。这里 addressing me 指"直接对我说话"。
  source: Notion · Daily
  added: "2026-07-29"
- term: side hustle
  kind: phrase
  meaning: 副业
  examples:
  - I'm thinking of getting a side hustle.
  note: 指本职之外的赚钱项目，带积极进取的意味。中性说法是 a second job；hustle 本身有"折腾、拼"的味道。
  source: Notion · Daily
  added: "2026-07-29"
- term: herd
  kind: word
  meaning: 兽群（牛、象等）
  examples:
  - We saw an elephant herd at the waterhole.
  note: 不同动物有不同集合名词：a herd of elephants、a flock of birds、a school of fish、a pack of wolves。
  source: Notion · Daily
  added: "2026-07-29"
- term: 宾语从句语序
  kind: pattern
  meaning: 从句里要用陈述语序（主语 + 动词），不能再用疑问语序
  examples:
  - I know why he leaves. ✅ / I know why does he leave. ❌
  - Can you explain how it works? ✅ / Can you explain how does it work? ❌
  note: 这是中文母语者最高频的错误之一。疑问词后面立刻跟主语，助动词 do/does 一律去掉，时态回归正常动词。
  source: Notion · Daily
  added: "2026-07-29"
- term: be … apart
  kind: pattern
  meaning: 相隔（时间或距离）
  examples:
  - They are about six weeks apart.
  note: 说年龄差、时间差、距离都能用：The two towns are 30 km apart. 兄弟姐妹年龄差常这么说。
  source: Notion · Daily
  added: "2026-07-29"
- term: a good match with
  kind: phrase
  meaning: 和……很搭
  examples:
  - This cucumber salad is a good match with spicy food.
  note: 食物搭配也常说 pairs well with（更地道）：This wine pairs well with seafood.
  source: Notion · Daily
  added: "2026-07-29"
- term: I would love to…
  kind: pattern
  meaning: 我很想……
  examples:
  - I would love to have six kids.
  note: 比 I want to 更热情也更礼貌。婉拒时也很好用：I'd love to, but I can't.
  source: Notion · Daily
  added: "2026-07-29"
- term: growing up
  kind: phrase
  meaning: 从小到大、在成长过程中
  examples:
  - Growing up, I had three siblings.
  note: 放句首作状语，等于 when I was a child。siblings 是兄弟姐妹的统称，不分性别。
  source: Notion · Daily
  added: "2026-07-29"
- term: picture sth
  kind: phrase
  meaning: 想象、设想
  examples:
  - What do you picture family life to look like?
  note: picture 作动词是"在脑中描绘"，比 imagine 更具画面感。常说 I can't picture it（我想象不出来）。
  source: Notion · Daily
  added: "2026-07-29"
- term: be on a call
  kind: phrase
  meaning: 在通话中
  examples:
  - Anytime we're all on a call, someone's connection drops.
  note: 电话或视频会议中用 on a call。注意介词是 on，不是 in。开会中是 in a meeting。
  source: Notion · Daily
  added: "2026-07-29"
- term: downstairs
  kind: word
  meaning: 在楼下
  examples:
  - I usually eat downstairs.
  note: 本身已含介词，不能说 in downstairs。对应 upstairs。楼下邻居是 the people downstairs。
  source: Notion · Daily
  added: "2026-07-29"
- term: gotta / down there
  kind: phrase
  meaning: 得去…… / 在下面那边
  examples:
  - We gotta go help fix a toddler issue down there now.
  note: gotta 是 have got to 的口语缩写，只用于说话和聊天，不写进正式文字。down there 指"下面某个地方"。
  source: Notion · Daily
  added: "2026-07-29"
- term: catch up on sleep
  kind: phrase
  meaning: 补觉
  examples:
  - I'm catching up on sleep this weekend.
  note: catch up on 用于补落下的东西：sleep、work、emails、a TV show。补觉也说 sleep in（睡懒觉）。
  source: Notion · Daily
  added: "2026-07-29"
- term: stay up late
  kind: phrase
  meaning: 熬夜
  examples:
  - I stayed up too late too many times this week.
  note: stay up 是"不去睡"，通宵是 stay up all night / pull an all-nighter。被吵醒睡不着是 be up。
  source: Notion · Daily
  added: "2026-07-29"
- term: goodwill
  kind: word
  meaning: 善意、好意
  examples:
  - They did it out of goodwill.
  note: 常搭配 out of goodwill（出于好意）、a goodwill gesture（示好的举动）。商业语境里还指"商誉"。
  source: Notion · Daily
  added: "2026-07-29"
- term: it seems to be
  kind: pattern
  meaning: 似乎是这样
  examples:
  - Is it fixed? — It seems to be.
  note: 回答时可以省略后面的内容，只说 It seems to be. 相当于中文的"看起来是的"。
  source: Notion · Daily
  added: "2026-07-29"
- term: come out
  kind: phrase
  meaning: 出现、显露；发布
  examples:
  - The sun came out in the afternoon. / The new season comes out next month.
  note: 一词多义，靠主语判断：天气、污渍、真相、新产品，都能 come out。
  source: Notion · Daily
  added: "2026-07-29"
- term: second time around
  kind: phrase
  meaning: 第二次（再来一次时）
  examples:
  - It was much easier the second time around.
  note: around 强调"再次经历同一件事"。也说 this time around（这一回）。
  source: Notion · Daily
  added: "2026-07-29"
- term: how soon…?
  kind: pattern
  meaning: 还要多久……？
  examples:
  - How soon will the baby come after the water breaks?
  note: how soon 问"多快会发生"，how long 问"持续多久"。原笔记的 water brakes 应作 water breaks（羊水破了）。
  source: Notion · Daily
  added: "2026-07-29"
- term: how far along
  kind: phrase
  meaning: 进展到哪一步了（尤指孕期）
  examples:
  - How far along are you? — About seven months.
  note: 问孕期进度的固定说法。泛用于项目进度：How far along is the migration?
  source: Notion · Daily
  added: "2026-07-29"
- term: in between
  kind: phrase
  meaning: 在（两者）中间的空档
  examples:
  - So you have time in between to catch a breath.
  note: 指两件事之间的间隙。catch a breath 是"喘口气"，也说 catch your breath。
  source: Notion · Daily
  added: "2026-07-29"
- term: can't wait
  kind: phrase
  meaning: 迫不及待
  examples:
  - I can't wait to see them.
  note: 后接 to + 动词原形，或 for + 名词：I can't wait for the weekend. 表达期待最自然的说法。
  source: Notion · Daily
  added: "2026-07-29"
- term: barely
  kind: word
  meaning: 几乎不
  examples:
  - We barely slept.
  note: barely 本身就是否定意义，不能再加 not。近义 hardly、scarcely。程度上 barely 强调"勉强达到或几乎没有"。
  source: Notion · Daily
  added: "2026-07-29"
- term: a lot sooner
  kind: pattern
  meaning: 早得多
  examples:
  - It happened a lot sooner than we expected.
  note: a lot 用来加强比较级，比 much 口语。同类：a lot better、a lot more expensive。
  source: Notion · Daily
  added: "2026-07-29"
- term: the other day
  kind: phrase
  meaning: 前几天
  examples:
  - I ran into him the other day.
  note: 指最近某天，不具体说是哪天，通常在一两周内。同类模糊时间：the other week、a while back。
  source: Notion · Daily
  added: "2026-07-29"
- term: get to do sth
  kind: pattern
  meaning: 有机会做（带幸运或享受的语气）
  examples:
  - I get to eat spicy food all the time.
  note: 和 have to（不得不）正好相反：I have to work weekends（无奈）vs I get to work from home（幸运）。
  source: Notion · Daily
  added: "2026-07-29"
- term: 分数表达
  kind: pattern
  meaning: one third of…；nine out of ten
  examples:
  - One third of the class was absent. / Nine out of ten people prefer it.
  note: 分子用基数词，分母用序数词；分子大于一时分母加 s（two thirds）。口语里 X out of Y 更常用也更好懂。
  source: Notion · Daily
  added: "2026-07-29"
- term: it's worth a lot
  kind: phrase
  meaning: 很值钱、很有价值
  examples:
  - That advice is worth a lot.
  note: worth 后面直接接名词，不加 of。同类：worth a try（值得一试）、worth it（值得）。
  source: Notion · Daily
  added: "2026-07-29"
- term: onwards
  kind: word
  meaning: 继续向前
  examples:
  - He waved and walked onwards.
  note: 英式拼 onwards，美式拼 onward。也用于时间：from 2020 onwards（从 2020 年起）。
  source: Notion · Daily
  added: "2026-07-29"
- term: on her own
  kind: phrase
  meaning: 自己、独自
  examples:
  - Sometimes she wakes up on her own.
  note: 强调"没人帮忙"。近义 by herself。alone 只是"独自一人"，不含"靠自己完成"的意思。
  source: Notion · Daily
  added: "2026-07-29"
- term: undivided attention
  kind: phrase
  meaning: 全神贯注、心无旁骛
  examples:
  - I can't give it my full undivided attention anymore.
  note: 固定搭配 give sb your undivided attention。undivided 就是"没被分走的"，所以带娃时说这句特别贴切。
  source: Notion · Daily
  added: "2026-07-29"
- term: a stretch
  kind: phrase
  meaning: 一段连续的时间
  examples:
  - I think I might get a two-hour stretch here.
  note: 指不被打断的一整段时间，常用于睡眠：a four-hour stretch of sleep。也指一段路或一段时期。
  source: Notion · Daily
  added: "2026-07-29"
- term: wrap up
  kind: phrase
  meaning: 收尾、结束
  examples:
  - I think I'll wrap up this video here.
  note: to finish / to bring something to an end。会议、视频、项目都能 wrap up。名词 a wrap 表示拍摄结束：That's a wrap.
  source: Notion · Daily
  added: "2026-07-29"
- term: here we are
  kind: phrase
  meaning: 我们到了
  examples:
  - Here we are — this is the place.
  note: 到达目的地时说。注意区分 there you go（给你/就这样）、here you are（东西递给你）。
  source: Notion · Daily
  added: "2026-07-29"
- term: flavorful
  kind: word
  meaning: 味道浓郁的
  examples:
  - The broth is so flavorful.
  note: 美式拼 flavorful，英式拼 flavourful。近义 tasty（好吃）、rich（浓厚）。夸汤头最贴切的就是 flavorful。
  source: Notion · Daily
  added: "2026-07-29"
- term: phenomenal
  kind: word
  meaning: 非凡的、了不起的
  examples:
  - The view was phenomenal.
  note: 强烈的褒义词，比 great 重得多。原笔记记作"太不寻常了"，实际语气是"太棒了"，而不是中性的"不寻常"。
  source: Notion · Daily
  added: "2026-07-29"
- term: home delivery
  kind: phrase
  meaning: 送货上门
  examples:
  - They do home deliveries now.
  note: 外卖更常说 food delivery、takeaway（英式）、takeout（美式）。点外卖的动作是 order in。
  source: Notion · Daily
  added: "2026-07-29"
- term: intervals / periods
  kind: word
  meaning: 节、时段
  examples:
  - Each game is played in three 20-minute periods.
  note: 冰球分三节（periods），足球两个 halves，篮球四节 quarters。interval 在英式里还指演出中场休息。
  source: Notion · Daily
  added: "2026-07-29"
- term: instead
  pos: adv.
  kind: word
  meaning: 反而、作为替代
  examples:
  - We didn't take a taxi, we walked instead.
  - Consider web search instead when you need a quick, specific fact.
  note: |-
    单独用时放句末。instead of 后接被替代的东西：We walked instead of taking a taxi.
    代替、而不是。暗示前面有另一个被比较的选项。 = in place of / rather than / in its place。
  source: Notion · Daily + English Teacher · Understanding "instead"
  added: "2026-07-29"
- term: step forward
  kind: phrase
  meaning: 上前一步；挺身而出
  examples:
  - I stepped forward to get a better look.
  note: 字面是往前走一步，引申义是"主动站出来"：Nobody stepped forward to take responsibility.
  source: Notion · Daily
  added: "2026-07-29"
- term: the catch
  kind: phrase
  meaning: 隐藏的条件、附带的问题
  examples:
  - The offer sounds great — the only catch is you have to pay in advance.
  note: 指看起来很好的事情背后的限制条件。近义 drawback、limitation。常说 What's the catch?（有什么陷阱？）
  source: Notion · Daily
  added: "2026-07-29"
- term: make it to somewhere
  kind: phrase
  meaning: 成功抵达
  examples:
  - We made it to the summit.
  note: make it 强调"克服困难才到达"，也用于赶上：I made it to the meeting on time. 单纯到达用 arrive / get to。
  source: Notion · Daily
  added: "2026-07-29"
- term: bucket list
  kind: phrase
  meaning: 遗愿清单、人生必做清单
  examples:
  - Seeing the northern lights is on my bucket list.
  note: 源自 kick the bucket（去世）。常说 tick sth off my bucket list（划掉一项）。
  source: Notion · Daily
  added: "2026-07-29"
- term: keep it up
  kind: phrase
  meaning: 保持下去、继续加油
  examples:
  - Great progress — keep it up!
  note: 鼓励对方维持现状的固定说法。近义 keep going（更强调别停）、keep at it（强调坚持啃难题）。
  source: Notion · Daily
  added: "2026-07-29"
- term: the road ahead
  kind: phrase
  meaning: 前方道路
  examples:
  - Follow the road ahead in a straight line.
  note: 字面指前面的路，比喻义是"未来的路"：The road ahead won't be easy. 问路对话里常出现。
  source: Notion · Daily
  added: "2026-07-29"
- term: that way
  kind: phrase
  meaning: 这样一来
  examples:
  - Tell me your address. That way, I can send you the documents.
  note: 用来说明前一句动作带来的好处，起因果连接作用。近义 so that…，但 that way 更口语、断句更轻。
  source: Notion · Daily
  added: "2026-07-29"
- term: the downside
  kind: phrase
  meaning: 不利之处、弊端
  examples:
  - The downside of modern life is that we're always reachable.
  note: 对应词是 the upside（好处）。近义 drawback。常说 the downside is that…
  source: Notion · Daily
  added: "2026-07-29"
- term: bend to the right
  kind: phrase
  meaning: 向右转弯（路自己拐弯）
  examples:
  - Take the main path ahead of you, go straight on, and keep going till the path bends to the right.
  note: bend 是路本身的弯曲；turn right 是你主动转向。听力指路题里这个区别很关键。
  source: Notion · Daily
  added: "2026-07-29"
- term: benefit from sth
  kind: phrase
  meaning: 从……中获益
  examples:
  - We all benefit in many ways from regular exercise.
  note: benefit from 是受益，benefit sb 是使某人受益（The change benefits everyone）。名词短语：the benefits of exercise。
  source: Notion · Daily
  added: "2026-07-29"
- term: hardly ever
  kind: phrase
  meaning: 几乎从不
  examples:
  - I hardly ever eat breakfast.
  note: 等于 almost never。hardly 本身是否定词，所以不能再加 not。位置放在主要动词前。
  source: Notion · Daily
  added: "2026-07-29"
- term: sit still
  kind: phrase
  meaning: 坐着不动
  examples:
  - They have to sit still and focus on one thing.
  note: still 在这里是形容词"静止的"，不是副词"仍然"。同类：stand still、hold still（别动，拍照或打针时说）。
  source: Notion · Daily
  added: "2026-07-29"
- term: that aspect of sth
  kind: phrase
  meaning: ……的那个方面
  examples:
  - That aspect of handwriting had never occurred to me before.
  note: occur to sb 是"（想法）突然进入某人脑中"，主语是想法不是人：It never occurred to me that…
  source: Notion · Daily
  added: "2026-07-29"
- term: associate A with B
  kind: phrase
  meaning: 把 A 和 B 联系起来
  examples:
  - I'd never associated spatial awareness with handwriting either.
  note: 固定介词是 with。名词 association 指这种心理关联：I have good associations with that song.
  source: Notion · Daily
  added: "2026-07-29"
- term: more to do with / in relation to
  kind: pattern
  meaning: 更多是关于…… / 相对于……而言
  examples:
  - I thought spatial awareness was more to do with knowing where you are in relation to objects or other people.
  note: in relation to 用于比较两者的大小、状态或位置关系。more to do with 用来纠正对方的理解侧重点，很委婉。
  source: Notion · Daily
  added: "2026-07-29"
- term: it's not just … that …
  kind: pattern
  meaning: 重要的不只是……
  examples:
  - It's not just the looks that matter.
  note: 这是强调句型 it is … that …，把 not just 放进去，用来突出"还有别的因素"。后面常接 it's also…
  source: Notion · Daily
  added: "2026-07-29"
- term: coordinate movement
  kind: phrase
  meaning: 协调动作
  examples:
  - Handwriting helps children coordinate movement.
  note: coordinate 作动词是"使协调配合"。名词 coordination：hand-eye coordination（手眼协调）是固定搭配。
  source: Notion · Daily
  added: "2026-07-29"
- term: anyone in particular
  kind: phrase
  meaning: 有特定的某个人吗
  examples:
  - So is there anyone in particular I should speak to there?
  note: in particular 放在名词后表示"特指的"。同类：anything in particular（有什么特别的吗）。
  source: Notion · Daily
  added: "2026-07-29"
- term: what are you up to?
  kind: pattern
  meaning: 你在忙什么？
  examples:
  - What are you up to this weekend?
  note: 问对方在做什么或有什么安排，比 What are you doing? 更随意。缩写 wuu2 只用于短信聊天。
  source: Notion · Daily
  added: "2026-07-29"
- term: it's everyday, bro
  kind: phrase
  meaning: 天天都这样
  examples:
  - Traffic like this? It's everyday, bro.
  note: 注意区分：everyday 是形容词"日常的"（everyday life），every day 是"每天"。这句口语里当"稀松平常"用。
  source: Notion · Daily
  added: "2026-07-29"
- term: Did you find anything to eat?
  kind: pattern
  meaning: 你找到吃的了吗？中文的「什么」在是非问句里要翻成 anything，不是 what。
  examples:
  - Did you find anything to eat?
  note: 「刚才」通常不用译出来。日常里 get 比 find 更常用：Did you get anything to eat?
  source: English Teacher · 中文日常问句的英文表达
  added: "2026-07-26"
- term: Have you found … yet?
  kind: pattern
  meaning: 现在完成时版本，暗示「到现在还没找到」。
  examples:
  - Have you found anything to eat yet?
  note: ❌ 不能和 just now / earlier 这类明确的过去时间词连用。
  source: English Teacher · 中文日常问句的英文表达
  added: "2026-07-26"
- term: never feels cramped
  kind: phrase
  meaning: 一点都不挤。描述场地空间的地道说法。
  examples:
  - Loads of room around each table — never feels cramped, even with a few people playing.
  note: 「地板减弱弹力」：the flooring softens / dampens the bounce。
  source: English Teacher · 乒乓球场地描写修改
  added: "2026-07-26"
- term: b 开头的称谓词
  kind: word
  meaning: 从最亲昵到最粗口都扎堆在 b 开头 —— 双唇音本来就是婴儿最早发出的音。
  examples:
  - bae · bro / bruv / brah · bud / buddy · boss · big guy
  note: boss 在服务业很常见："What can I get you, boss?"
  source: English Teacher · B开头的英文称谓词
  added: "2026-07-26"
- term: a big idea
  kind: phrase
  meaning: 重大的、有分量的核心构想。商业和广告里 the big idea = 核心创意。
  examples:
  - So that is a big idea.
  note: 语气看上下文，也可能是反讽：「哦，这就算大创意了？」
  source: English Teacher · 理解"So that is a big idea"
  added: "2026-07-24"
- term: conduct
  pos: v.
  kind: word
